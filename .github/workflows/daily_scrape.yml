name: Daily Sorting Data Scrape

on:
  workflow_dispatch:
    inputs:
      subbatch:
        description: "Optional subbatch override (e.g. NJSUB-202606092100)"
        required: false
      machine_id:
        description: "Optional machine id override"
        required: false
        default: "9"
      dry_run:
        description: "Scrape only, do not write to Supabase"
        type: boolean
        default: false

  schedule:
    - cron: "30 21 * * *"
      timezone: America/New_York

concurrency:
  group: sorting-data-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Verify required secrets
        env:
          UNIUNI_USERNAME: ${{ secrets.UNIUNI_USERNAME }}
          UNIUNI_PASSWORD: ${{ secrets.UNIUNI_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "FAIL: $name is empty"
              exit 1
            fi
            echo "OK: $name length=${#value}"
          }
          check_secret UNIUNI_USERNAME "$UNIUNI_USERNAME"
          check_secret UNIUNI_PASSWORD "$UNIUNI_PASSWORD"
          check_secret GOOGLE_CREDENTIALS "$GOOGLE_CREDENTIALS"
          check_secret GOOGLE_SHEETS_ID "$GOOGLE_SHEETS_ID"
          check_secret SUPABASE_URL "$SUPABASE_URL"
          check_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Run scraper
        env:
          UNIUNI_USERNAME: ${{ secrets.UNIUNI_USERNAME }}
          UNIUNI_PASSWORD: ${{ secrets.UNIUNI_PASSWORD }}
          UNIUNI_URL: https://tools.uniuni.com:8203/
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEET_NAME: subbatch scrape
          GOOGLE_WORKSHEET_NAME: subbatch scrape
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUBBATCH: ${{ github.event.inputs.subbatch }}
          MACHINE_ID: ${{ github.event.inputs.machine_id || '9' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.subbatch }}" ]; then
            ARGS="$ARGS --subbatch ${{ github.event.inputs.subbatch }}"
          fi
          if [ -n "${{ github.event.inputs.machine_id }}" ]; then
            ARGS="$ARGS --machine-id ${{ github.event.inputs.machine_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS
